<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giám sát phòng học</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="server-banner" hidden>Mất kết nối máy chủ – đang hiển thị số liệu cũ</div>

  <section id="device">
    <span id="device-dot"></span>
    <strong id="device-status">Đang kết nối…</strong>
    <small id="device-seen"></small>
  </section>

  <section id="cards">
    <article class="card" data-param="temperature"><h2>Nhiệt độ</h2><p class="value">—</p><p class="flag"></p></article>
    <article class="card" data-param="humidity"><h2>Độ ẩm</h2><p class="value">—</p><p class="flag"></p></article>
    <article class="card" data-param="lux"><h2>Ánh sáng</h2><p class="value">—</p><p class="flag"></p></article>
  </section>

  <!-- Tuần 2: biểu đồ, cảnh báo, cài đặt ngưỡng -->

  <script src="js/app.js"></script>
</body>
</html>
